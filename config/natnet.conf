# NatNet config for C++ mocap_reader.
# Format: key=value.

# false = Unicast, true = Multicast
use_multicast=false

# Motive/NatNet 3+ is the common default. Handshake updates this when available.
protocol_major=3

# Unicast: Motive PC IP / this client PC IP.
# For local_address, 0.0.0.0 listens on all interfaces.
server_address=192.168.0.189
# local_address=0.0.0.0
local_address=192.168.0.28

# Multicast address used by Motive when use_multicast=true.
multicast_address=239.255.42.99

# NatNet default ports.
command_port=1510
data_port=1511

# Rigid body IDs configured in Motive. Names are local labels matched by order.
rigid_body_id=6,7
rigid_body_name="box1","go2"
